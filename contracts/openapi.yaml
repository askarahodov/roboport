openapi: 3.1.2
info:
  title: ROBOport — API contract (draft, synthetic only)
  version: 0.15.0-draft
  description: Проектный контракт. Нет серверной реализации, не собирать реальные клиентские данные. Методы и статусы
    подлежат независимому ревью. Маркеры x-roboport-roles/guards — проектная документация; безопасность требует реализации.
    Статус-токен передаётся только в заголовке. Полноценный защищённый клиентский кабинет — обязательная часть MVP; API
    ещё не реализован.
servers:
- url: https://api.example.invalid
  description: Placeholder, not a live server
tags:
- name: Catalog
- name: Requests
- name: Tickets
- name: Intake
- name: Diagnosis
- name: Estimates
- name: Capabilities
- name: Parts
- name: Inventory
- name: Quality
- name: Suppliers
- name: Audit
- name: Reports
- name: Attachments
- name: CustomerPortal
- name: Auth
components:
  securitySchemes:
    localSession:
      type: apiKey
      in: cookie
      name: rp_session
      description: Server-managed opaque cookie session; HTTP-only; CSRF verification required for unsafe methods.
    statusToken:
      type: apiKey
      in: header
      name: X-ROBOport-Status-Token
      description: Opaque random short-lived token, hash stored server-side; never include in URLs or logs.
  schemas:
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
      additionalProperties: false
    AuthSession:
      type: object
      required: [userId, roles, csrfToken]
      properties:
        userId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
        csrfToken:
          type: string
          minLength: 16
          description: Token returned only after authenticating; send via X-CSRF-Token for unsafe requests.
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 12
      additionalProperties: false
    AuthResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
      additionalProperties: false
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          example: PART_UNVERIFIED
        message:
          type: string
          example: Операция недоступна
        requestId: &id001
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
      additionalProperties: false
    Brand:
      type: object
      required:
      - id
      - name
      properties:
        id: *id001
        name:
          type: string
        country:
          type: string
        officialUrl:
          type: string
          format: uri
      additionalProperties: false
    Model:
      type: object
      required:
      - id
      - brandId
      - name
      - category
      - supportStatus
      properties:
        id: *id001
        brandId: *id001
        name:
          type: string
        category:
          type: string
          enum:
          - vacuum
          - window_cleaner
          - lawn_mower
          - pool_cleaner
          - companion
          - quadruped
          - humanoid
          - other
        supportStatus:
          type: string
          enum:
          - candidate
          - evaluation
          - supported
          - restricted
          - not_supported
          - retired
        sourceUrl:
          type: string
          format: uri
      additionalProperties: false
    ModelVariant:
      type: object
      required:
      - id
      - modelId
      properties:
        id: *id001
        modelId: *id001
        manufacturerSku:
          type: string
        regionCode:
          type: string
        hardwareRevision:
          type: string
        dockSku:
          type: string
      additionalProperties: false
    CreateRequest:
      type: object
      required:
      - contact
      - symptoms
      - consentVersion
      properties:
        modelId: *id001
        contact:
          type: object
          required:
          - preferredChannel
          properties:
            preferredChannel:
              type: string
              enum:
              - email
              - phone
            email:
              type: string
              format: email
            phone:
              type: string
          additionalProperties: false
          allOf:
          - if:
              properties:
                preferredChannel:
                  const: email
              required:
              - preferredChannel
            then:
              required:
              - email
          - if:
              properties:
                preferredChannel:
                  const: phone
              required:
              - preferredChannel
            then:
              required:
              - phone
        symptoms:
          type: string
          minLength: 10
          maxLength: 3000
        safetyFlags:
          type: array
          items:
            type: string
        consentVersion:
          type: string
        attachmentIds:
          type: array
          items: *id001
      additionalProperties: false
    RequestReceipt:
      type: object
      required:
      - reference
      - status
      properties:
        reference:
          type: string
          example: RP-DEMO-0002
        status:
          type: string
          example: SUBMITTED
        message:
          type: string
      additionalProperties: false
    StatusSummary:
      type: object
      required:
      - reference
      - stage
      - updatedAt
      properties:
        reference:
          type: string
        stage:
          type: string
        updatedAt:
          type: string
          format: date-time
        publicNote:
          type: string
      additionalProperties: false
    Ticket:
      type: object
      required:
      - id
      - reference
      - state
      - version
      properties:
        id: *id001
        reference:
          type: string
        state:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - TRIAGE
          - AWAITING_DELIVERY
          - RECEIVED
          - DIAGNOSING
          - SAFETY_HOLD
          - ESTIMATE_DRAFT
          - AWAITING_APPROVAL
          - APPROVED
          - DECLINED
          - AWAITING_PARTS
          - REPAIRING
          - QC_PENDING
          - QC_FAILED
          - READY_FOR_HANDOVER
          - COMPLETED
          - CANCELLED
          - UNREPAIRABLE
          - WARRANTY_ROUTE
        version:
          type: integer
          minimum: 1
        modelVariantId: *id001
        safetyFlags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    CreateTicket:
      type: object
      required:
      - customerId
      - symptoms
      properties:
        customerId: *id001
        deviceId: *id001
        symptoms:
          type: string
          minLength: 5
        source:
          type: string
          enum:
          - walk_in
          - web
          - partner
        safetyFlags:
          type: array
          items:
            type: string
      additionalProperties: false
    Intake:
      type: object
      required:
      - accessories
      - conditionNotes
      - signedDocumentId
      properties:
        accessories:
          type: array
          items:
            type: string
        conditionNotes:
          type: string
        signedDocumentId: *id001
        attachmentIds:
          type: array
          items: *id001
        expectedTicketVersion:
          type: integer
          minimum: 1
      additionalProperties: false
    Diagnosis:
      type: object
      required:
      - observations
      - riskLevel
      - minutes
      properties:
        observations:
          type: string
        hypothesis:
          type: string
        confirmedFault:
          type: string
        riskLevel:
          type: string
          enum:
          - low
          - medium
          - critical
        minutes:
          type: integer
          minimum: 0
        evidenceIds:
          type: array
          items: *id001
      additionalProperties: false
    EstimateLine:
      type: object
      required:
      - kind
      - description
      - quantity
      - unitPrice
      properties:
        kind:
          type: string
          enum:
          - labor
          - part
          - logistics
        description:
          type: string
        partId: *id001
        quantity:
          type: number
          exclusiveMinimum: 0
        unitPrice:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
          example: '1500.00'
        compatibilityEvidenceId: *id001
      additionalProperties: false
    EstimateInput:
      type: object
      required:
      - lines
      - currency
      - expectedTicketVersion
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/EstimateLine'
          minItems: 1
        currency:
          type: string
          enum:
          - RUB
        expectedTicketVersion:
          type: integer
          minimum: 1
      additionalProperties: false
    Estimate:
      type: object
      required:
      - id
      - ticketId
      - version
      - status
      - total
      properties:
        id: *id001
        ticketId: *id001
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - DRAFT
          - SENT
          - APPROVED
          - DECLINED
          - SUPERSEDED
        total:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
        currency:
          type: string
          example: RUB
      additionalProperties: false
    EstimateApproval:
      type: object
      required:
      - estimateVersion
      - approvalMethod
      properties:
        estimateVersion:
          type: integer
          minimum: 1
        approvalMethod:
          type: string
          enum:
          - verified_account
          - verified_signature
      additionalProperties: false
    EstimateDecline:
      type: object
      required:
      - estimateVersion
      properties:
        estimateVersion:
          type: integer
          minimum: 1
        reason:
          type: string
      additionalProperties: false
    Transition:
      type: object
      required:
      - targetState
      - expectedVersion
      - reason
      properties:
        targetState:
          type: string
          enum:
          - SUBMITTED
          - TRIAGE
          - AWAITING_DELIVERY
          - RECEIVED
          - DIAGNOSING
          - SAFETY_HOLD
          - ESTIMATE_DRAFT
          - AWAITING_APPROVAL
          - APPROVED
          - DECLINED
          - AWAITING_PARTS
          - REPAIRING
          - QC_PENDING
          - QC_FAILED
          - READY_FOR_HANDOVER
          - COMPLETED
          - CANCELLED
          - UNREPAIRABLE
          - WARRANTY_ROUTE
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 3
      additionalProperties: false
    CapabilityUpdate:
      type: object
      required:
      - status
      - evidenceId
      - reviewerUserId
      properties:
        status:
          type: string
          enum:
          - candidate
          - evaluation
          - approved
          - restricted
          - revoked
        evidenceId: *id001
        reason:
          type: string
      additionalProperties: false
    Part:
      type: object
      required:
      - id
      - partNumber
      - name
      properties:
        id: *id001
        partNumber:
          type: string
        name:
          type: string
        compatibilityStatus:
          type: string
          enum:
          - unverified
          - manufacturer_documented
          - technician_tested
          - incompatible
          - revoked
      additionalProperties: false
    CompatibilityInput:
      type: object
      required:
      - modelVariantId
      - status
      - evidenceId
      properties:
        modelVariantId: *id001
        status:
          type: string
          enum:
          - unverified
          - manufacturer_documented
          - technician_tested
          - incompatible
          - revoked
        evidenceId: *id001
      additionalProperties: false
    ReserveStock:
      type: object
      required:
      - ticketId
      - lotId
      - partId
      - quantity
      - expectedTicketVersion
      properties:
        ticketId: *id001
        lotId: *id001
        partId: *id001
        quantity:
          type: integer
          minimum: 1
        expectedTicketVersion:
          type: integer
          minimum: 1
      additionalProperties: false
    ReleaseStock:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
      additionalProperties: false
    StockMovement:
      type: object
      required:
      - lotId
      - deltaQty
      - reason
      properties:
        lotId: *id001
        ticketId: *id001
        deltaQty:
          type: integer
        reason:
          type: string
          minLength: 3
      additionalProperties: false
    Worklog:
      type: object
      required:
      - minutes
      - description
      - serviceOperationId
      properties:
        minutes:
          type: integer
          minimum: 1
        description:
          type: string
        serviceOperationId: *id001
        partId: *id001
      additionalProperties: false
    QualityCheck:
      type: object
      required:
      - checklistVersion
      - result
      - checks
      properties:
        checklistVersion:
          type: string
        result:
          type: string
          enum:
          - PASS
          - FAIL
        checks:
          type: array
          items:
            type: object
            required:
            - check
            - passed
            properties:
              check:
                type: string
              passed:
                type: boolean
              note:
                type: string
            additionalProperties: false
      additionalProperties: false
    Handover:
      type: object
      required:
      - outcome
      - documentId
      - recipientVerified
      properties:
        outcome:
          type: string
          enum:
          - REPAIRED
          - UNREPAIRED
          - REFERRED
        documentId: *id001
        recipientVerified:
          type: boolean
      additionalProperties: false
    Supplier:
      type: object
      required:
      - id
      - name
      - verificationStatus
      properties:
        id: *id001
        name:
          type: string
        verificationStatus:
          type: string
          enum:
          - unverified
          - contact_verified
          - commercially_verified
          - blocked
      additionalProperties: false
    SupplierQuote:
      type: object
      required:
      - partId
      - unitPrice
      - currency
      - minimumOrderQuantity
      - validUntil
      properties:
        partId: *id001
        unitPrice:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
        currency:
          type: string
        minimumOrderQuantity:
          type: integer
          minimum: 1
        validUntil:
          type: string
          format: date
        documentId: *id001
      additionalProperties: false
    AttachmentInit:
      type: object
      required:
      - ticketId
      - mimeType
      - sizeBytes
      properties:
        ticketId: *id001
        mimeType:
          type: string
          enum:
          - image/jpeg
          - image/png
          - application/pdf
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10000000
      additionalProperties: false
    AttachmentUpload:
      type: object
      required:
      - id
      - uploadUrl
      - expiresAt
      properties:
        id: *id001
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    AuditEvent:
      type: object
      required:
      - id
      - action
      - time
      properties:
        id: *id001
        action:
          type: string
        entityType:
          type: string
        time:
          type: string
          format: date-time
      additionalProperties: false
    OperationResult:
      type: object
      required:
      - id
      - status
      properties:
        id: *id001
        status:
          type: string
        version:
          type: integer
      additionalProperties: false
    PaginatedBrands:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
        nextCursor:
          type: string
      additionalProperties: false
    PaginatedModels:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Model'
        nextCursor:
          type: string
      additionalProperties: false
    PaginatedTickets:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        nextCursor:
          type: string
      additionalProperties: false
    PaginatedParts:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Part'
        nextCursor:
          type: string
      additionalProperties: false
    PaginatedSuppliers:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Supplier'
        nextCursor:
          type: string
      additionalProperties: false
    PaginatedAudits:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        nextCursor:
          type: string
      additionalProperties: false
    OperationsSummary:
      type: object
      required:
      - newRequests
      - safetyHolds
      - qcFailed
      properties:
        newRequests:
          type: integer
        safetyHolds:
          type: integer
        qcFailed:
          type: integer
      additionalProperties: false
    CustomerProfile:
      type: object
      required:
      - accountId
      - displayName
      - locale
      properties:
        accountId: *id001
        displayName:
          type: string
        locale:
          type: string
          enum:
          - ru
          - en
        verifiedContacts:
          type: array
          items:
            type: string
        accountStatus:
          type: string
          enum:
          - active
          - blocked
          - closed
      additionalProperties: false
    ProfileUpdate:
      type: object
      required:
      - expectedVersion
      properties:
        displayName:
          type: string
          maxLength: 120
        locale:
          type: string
          enum:
          - ru
          - en
        expectedVersion:
          type: integer
          minimum: 1
      additionalProperties: false
    CustomerDevice:
      type: object
      required:
      - id
      - modelName
      - supportStatus
      properties:
        id: *id001
        modelName:
          type: string
        modelVariantId: *id001
        maskedSerial:
          type: string
        supportStatus:
          type: string
          enum:
          - candidate
          - evaluation
          - supported
          - restricted
          - not_supported
        dockModel:
          type: string
        lastVisitAt:
          type: string
          format: date-time
      additionalProperties: false
    CustomerDeviceDetail:
      type: object
      required:
      - device
      - tickets
      properties:
        device:
          $ref: '#/components/schemas/CustomerDevice'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/CustomerTicket'
        note:
          type: string
      additionalProperties: false
    CustomerTicket:
      type: object
      required:
      - id
      - reference
      - state
      - updatedAt
      properties:
        id: *id001
        reference:
          type: string
        state:
          type: string
        updatedAt:
          type: string
          format: date-time
        publicNote:
          type: string
        hasPendingEstimate:
          type: boolean
      additionalProperties: false
    CustomerTicketDetail:
      type: object
      required:
      - ticket
      - timeline
      - estimate
      properties:
        ticket:
          $ref: '#/components/schemas/CustomerTicket'
        timeline:
          type: array
          items:
            type: object
            required:
            - state
            - at
            properties:
              state:
                type: string
              at:
                type: string
                format: date-time
              note:
                type: string
            additionalProperties: false
        estimate:
          $ref: '#/components/schemas/Estimate'
      additionalProperties: false
    CustomerDocument:
      type: object
      required:
      - id
      - ticketId
      - type
      - createdAt
      properties:
        id: *id001
        ticketId: *id001
        type:
          type: string
          enum:
          - intake
          - estimate
          - handover
          - warranty
          - invoice
        createdAt:
          type: string
          format: date-time
        title:
          type: string
      additionalProperties: false
    NotificationPreference:
      type: object
      required:
      - eventType
      - channel
      - enabled
      - purpose
      properties:
        eventType:
          type: string
        channel:
          type: string
          enum:
          - email
          - sms
          - in_app
        enabled:
          type: boolean
        purpose:
          type: string
          enum:
          - service
          - marketing
      additionalProperties: false
    NotificationPreferences:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreference'
      additionalProperties: false
    NotificationPreferenceUpdate:
      type: object
      required:
      - items
      - expectedVersion
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreference'
        expectedVersion:
          type: integer
          minimum: 1
      additionalProperties: false
    ClaimRequest:
      type: object
      required:
      - reference
      - challengeReference
      properties:
        reference:
          type: string
          minLength: 8
        challengeReference: *id001
      additionalProperties: false
    ClaimResult:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - pending_review
          - rejected
        message:
          type: string
      additionalProperties: false
    RepeatRequest:
      type: object
      required:
      - symptoms
      - consentVersion
      properties:
        symptoms:
          type: string
          minLength: 10
          maxLength: 3000
        consentVersion:
          type: string
        safetyFlags:
          type: array
          items:
            type: string
      additionalProperties: false
    DocumentAccess:
      type: object
      required:
      - downloadUrl
      - expiresAt
      properties:
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        cachePolicy:
          type: string
          example: no-store
      additionalProperties: false
    CustomerDevices:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerDevice'
        nextCursor:
          type: string
      additionalProperties: false
    CustomerTickets:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerTicket'
        nextCursor:
          type: string
      additionalProperties: false
    CustomerDocuments:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerDocument'
      additionalProperties: false
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: *id001
    EstimateId:
      name: estimateId
      in: path
      required: true
      schema: *id001
    PartId:
      name: partId
      in: path
      required: true
      schema: *id001
    VariantId:
      name: variantId
      in: path
      required: true
      schema: *id001
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema: *id001
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema: *id001
    ModelId:
      name: modelId
      in: path
      required: true
      schema: *id001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Unique opaque request key per verified client account. In the synthetic v0.9 single-process fixture,
        identical repeats reuse a successful response and a changed method/path/payload with the same key returns 409.
        HTTP authorization is rechecked on every replay. NOT durable or cross-worker production idempotency.
    AccessToken:
      name: X-ROBOport-Status-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: *id001
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: *id001
    OperationId:
