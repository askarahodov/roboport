# Только изолированный синтетический dev-контур.
services:
  minio:
    image: tobi312/minio@sha256:e2226dea4b9aef896db02f7396102d48eb58cd339d930332e3d8bdac80012a78
    command: server /data --console-address ":9001"
    env_file:
      - path: .env.local
        required: true
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - roboport_minio_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: "no"
    security_opt:
      - no-new-privileges:true

volumes:
  roboport_minio_data:
