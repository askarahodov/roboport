services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: roboport
      POSTGRES_USER: roboport
      POSTGRES_PASSWORD: roboport-synthetic-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roboport -d roboport"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    restart: "no"
