name: ROBOport bootstrap CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Для feature-веток достаточно PR-проверок. Устаревшие прогоны одного PR отменяются.
concurrency:
  group: roboport-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roboport
          POSTGRES_PASSWORD: roboport
          POSTGRES_DB: roboport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roboport -d roboport"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROBOport_DATABASE_URL: postgresql+psycopg://roboport:roboport@127.0.0.1:5432/roboport
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r apps/api/requirements-dev.txt -c apps/api/constraints-py313.txt
      - run: python scripts/check_python_pins.py
      - run: python scripts/check_brand_tokens.py
      - name: Real PostgreSQL upgrade / downgrade / re-upgrade
        run: |
          python -m alembic -c apps/api/alembic.ini upgrade head
          python -m alembic -c apps/api/alembic.ini downgrade base
          python -m alembic -c apps/api/alembic.ini upgrade head
      - name: PostgreSQL integrity integration tests
        run: python -m pytest -q -ra tests/integration
      - name: Seed synthetic live automotive lifecycle before pg_dump
        shell: bash
        run: |
          set -euo pipefail
          # Only disposable loopback PG17; private UUID/digest manifest is
          # kept outside Git and is never sent to logs or the DB dump.
          PYTHONPATH="apps/api:tests/integration" python -m scripts.auto_restore_lifecycle_probe \
            seed --manifest /tmp/roboport-auto-lifecycle-restore.json
          # A second, independent source-to-live migration set (VEHICLE,
          # SERVICE, SKU/STOCK) must also survive the same full archive.
          PYTHONPATH="apps/api:tests/integration" python -m scripts.auto_cutover_restore_probe \
            seed --manifest /tmp/roboport-auto-cutover-restore.json
      - name: Synthetic PostgreSQL pg_dump / pg_restore roundtrip
        shell: bash
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" psql -U roboport -d roboport -v ON_ERROR_STOP=1 -c "INSERT INTO customer(id,label) VALUES('11111111-1111-4111-8111-111111111111','restore-probe')"
          # Include a real automotive tenant row in the snapshot, not only legacy customer.
          docker exec "$PG_CONTAINER" psql -U roboport -d roboport -v ON_ERROR_STOP=1 -c "INSERT INTO auto_organization(id,code,display_name) VALUES('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','RESTORE_PROBE','Synthetic restore probe')"
          # Synthetic migration #172 must survive a real dump/restore, not just
          # preserve legacy tables or the tenant identity.
          docker exec "$PG_CONTAINER" psql -U roboport -d roboport -v ON_ERROR_STOP=1 -c "INSERT INTO auto_service_location(id,code,organization_id) VALUES('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaab','RESTORE_LOC','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa')"
          docker exec "$PG_CONTAINER" psql -U roboport -d roboport -v ON_ERROR_STOP=1 -c "INSERT INTO auto_migration_staging_batch(id,organization_id,source_sha256,row_count,sku_count,stock_count) VALUES('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaac','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',repeat('a',64),2,1,1)"
          docker exec "$PG_CONTAINER" psql -U roboport -d roboport -v ON_ERROR_STOP=1 -c "INSERT INTO auto_migration_staging_line(batch_id,line_number,organization_id,location_id,record_type,source_id,article,quantity) VALUES('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaac',2,'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaab','SKU','RESTORE-SKU','FILTER-001',0),('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaac',3,'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaab','STOCK','RESTORE-STOCK','FILTER-001',9)"
          # Vehicle migration is separate from the live auto_vehicle and owner links.
          docker exec "$PG_CONTAINER" psql -U roboport -d roboport -v ON_ERROR_STOP=1 -c "INSERT INTO auto_vehicle_migration_batch(id,organization_id,source_sha256,row_count) VALUES('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaad','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',repeat('b',64),1)"
          docker exec "$PG_CONTAINER" psql -U roboport -d roboport -v ON_ERROR_STOP=1 -c "INSERT INTO auto_vehicle_migration_line(batch_id,row_number,organization_id,location_id,source_id,source_system,vin,make,model) VALUES('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaad',2,'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaab','RESTORE-CAR','DEMO','1HGCM82633A004359','SYNTHETIC','TEST CAR')"
          docker exec "$PG_CONTAINER" pg_dump -U roboport -Fc -f /tmp/roboport-synthetic.dump roboport
          docker exec "$PG_CONTAINER" createdb -U roboport roboport_restored
          docker exec "$PG_CONTAINER" pg_restore -U roboport --exit-on-error -d roboport_restored /tmp/roboport-synthetic.dump
          # Confirm restored *live* synthetic booking/order/stock/finance graph
          # against the exact pre-dump snapshot, then challenge restored
          # immutable, cancellation, exclusion and tenant boundary triggers.
          PYTHONPATH="apps/api:tests/integration" python -m scripts.auto_restore_lifecycle_probe \
            verify --manifest /tmp/roboport-auto-lifecycle-restore.json \
            --database roboport
          PYTHONPATH="apps/api:tests/integration" python -m scripts.auto_restore_lifecycle_probe \
            verify-clone --manifest /tmp/roboport-auto-lifecycle-restore.json \
            --database roboport_restored
          # Verify all three staged + activated automotive domains with
          # immutable source/live receipt provenance and clone-only probes.
          PYTHONPATH="apps/api:tests/integration" python -m scripts.auto_cutover_restore_probe \
            verify --manifest /tmp/roboport-auto-cutover-restore.json \
            --database roboport
          PYTHONPATH="apps/api:tests/integration" python -m scripts.auto_cutover_restore_probe \
            verify-clone --manifest /tmp/roboport-auto-cutover-restore.json \
            --database roboport_restored
          ORIGINAL="$(docker exec "$PG_CONTAINER" psql -U roboport -d roboport -At -c "SELECT count(*) FROM customer WHERE label='restore-probe'")"
          RESTORED="$(docker exec "$PG_CONTAINER" psql -U roboport -d roboport_restored -At -c "SELECT count(*) FROM customer WHERE label='restore-probe'")"
          test "$ORIGINAL" = 1
          test "$RESTORED" = "$ORIGINAL"
          RESTORED_REV="$(docker exec "$PG_CONTAINER" psql -U roboport -d roboport_restored -At -c "SELECT version_num FROM alembic_version")"
          CURRENT_REV="$(docker exec "$PG_CONTAINER" psql -U roboport -d roboport -At -c "SELECT version_num FROM alembic_version")"
          test -n "$CURRENT_REV"
          test "$RESTORED_REV" = "$CURRENT_REV"
          # Verify restored automotive data, identity constraints and immutability.
          ORIGINAL_AUTO="$(docker exec "$PG_CONTAINER" psql -U roboport -d roboport -At -c "SELECT count(*) FROM auto_organization WHERE code='RESTORE_PROBE'")"
          RESTORED_AUTO="$(docker exec "$PG_CONTAINER" psql -U roboport -d roboport_restored -At -c "SELECT count(*) FROM auto_organization WHERE code='RESTORE_PROBE'")"
          test "$ORIGINAL_AUTO" = 1
          test "$RESTORED_AUTO" = "$ORIGINAL_AUTO"
          # Compare restored migration batch, row counts and stock quantity.
          for database in roboport roboport_restored; do
            test "$(docker exec "$PG_CONTAINER" psql -U roboport -d "$database" -At -c "SELECT row_count || ':' || sku_count || ':' || stock_count FROM auto_migration_staging_batch WHERE id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaac'")" = '2:1:1'
            test "$(docker exec "$PG_CONTAINER" psql -U roboport -d "$database" -At -c "SELECT count(*) || ':' || sum(quantity) FROM auto_migration_staging_line WHERE batch_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaac'")" = '2:9'
          done
          # The separate vehicle staging batch must restore without promoting a VIN
          # to live vehicles or creating a customer ownership/history link.
          for database in roboport roboport_restored; do
            test "$(docker exec "$PG_CONTAINER" psql -U roboport -d "$database" -At -c "SELECT row_count FROM auto_vehicle_migration_batch WHERE id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaad'")" = 1
            test "$(docker exec "$PG_CONTAINER" psql -U roboport -d "$database" -At -c "SELECT count(*) FROM auto_vehicle_migration_line WHERE batch_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaad' AND vin='1HGCM82633A004359'")" = 1
            test "$(docker exec "$PG_CONTAINER" psql -U roboport -d "$database" -At -c "SELECT count(*) FROM auto_vehicle WHERE vin='1HGCM82633A004359'")" = 0
          done
          if docker exec "$PG_CONTAINER" psql -U roboport -d roboport_restored -v ON_ERROR_STOP=1 -c "UPDATE auto_vehicle_migration_line SET source_id='TAMPERED' WHERE batch_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaad' AND row_number=2"; then
            echo 'VEHICLE RESTORE FAILURE: immutable staged vehicle accepted update' >&2
            exit 1
          fi
          if docker exec "$PG_CONTAINER" psql -U roboport -d roboport_restored -v ON_ERROR_STOP=1 -c "INSERT INTO auto_vehicle_migration_line(batch_id,row_number,organization_id,location_id,source_id,source_system,vin,make,model) VALUES('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaad',3,'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','99999999-9999-4999-8999-999999999999','BAD-CAR','DEMO','JH4KA7561PC008269','SYNTHETIC','TEST CAR')"; then
            echo 'VEHICLE RESTORE FAILURE: out-of-scope branch accepted' >&2
            exit 1
          fi
          echo 'VEHICLE STAGING RESTORE PASS: metadata, VIN, immutable rows, scope and zero promotion'
          # Restoration must retain immutable-line enforcement and branch scope.
          if docker exec "$PG_CONTAINER" psql -U roboport -d roboport_restored -v ON_ERROR_STOP=1 -c "UPDATE auto_migration_staging_line SET quantity=10 WHERE batch_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaac' AND line_number=3"; then
            echo 'STAGING RESTORE FAILURE: immutable imported line accepted update' >&2
            exit 1
          fi
          if docker exec "$PG_CONTAINER" psql -U roboport -d roboport_restored -v ON_ERROR_STOP=1 -c "INSERT INTO auto_migration_staging_line(batch_id,line_number,organization_id,location_id,record_type,source_id,article,quantity) VALUES('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaac',4,'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','99999999-9999-4999-8999-999999999999','STOCK','BAD-SCOPE','FILTER-001',1)"; then
            echo 'STAGING RESTORE FAILURE: foreign branch accepted' >&2
            exit 1
          fi
          echo 'STAGING RESTORE PASS: source counts, stock quantity, immutability and scope preserved'
          if docker exec "$PG_CONTAINER" psql -U roboport -d roboport_restored -v ON_ERROR_STOP=1 -c "UPDATE auto_organization SET code='MUTATED' WHERE code='RESTORE_PROBE'"; then
            echo 'AUTO RESTORE INTEGRITY FAILURE: immutable tenant identity accepted mutation' >&2
            exit 1
          fi
          if docker exec "$PG_CONTAINER" psql -U roboport -d roboport_restored -v ON_ERROR_STOP=1 -c "INSERT INTO auto_organization(id,code,display_name) VALUES('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb','RESTORE_PROBE','Duplicate')"; then
            echo 'AUTO RESTORE INTEGRITY FAILURE: duplicate organization accepted' >&2
            exit 1
          fi
          echo 'AUTO RESTORE INTEGRITY PASS: tenant persisted, immutability and uniqueness enforced'
          docker exec "$PG_CONTAINER" psql -U roboport -d roboport_restored -v ON_ERROR_STOP=1 -c "INSERT INTO audit_event(id,action) VALUES('22222222-2222-4222-8222-222222222222','restore-ok')"
          # Validate restored relational integrity, not just an isolated marker.
          docker exec "$PG_CONTAINER" psql -U roboport -d roboport_restored -v ON_ERROR_STOP=1 -c "INSERT INTO service_ticket(id,customer_id) VALUES('33333333-3333-4333-8333-333333333333','11111111-1111-4111-8111-111111111111')"
          test "$(docker exec "$PG_CONTAINER" psql -U roboport -d roboport_restored -At -c "SELECT count(*) FROM service_ticket WHERE customer_id='11111111-1111-4111-8111-111111111111'")" = 1
          if docker exec "$PG_CONTAINER" psql -U roboport -d roboport_restored -v ON_ERROR_STOP=1 -c "INSERT INTO service_ticket(id,customer_id) VALUES('44444444-4444-4444-8444-444444444444','99999999-9999-4999-8999-999999999999')"; then
            echo 'RESTORE INTEGRITY FAILURE: foreign key accepted missing customer' >&2
            exit 1
          fi
          echo 'RESTORE INTEGRITY PASS: existing customer works, missing customer rejected'
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r apps/api/requirements-dev.txt -c apps/api/constraints-py313.txt
      - run: python scripts/check_python_pins.py
      - run: python -m pip install openapi-spec-validator==0.7.2
      - run: python -m pip check
      - run: PYTHONPATH=apps/api python -m pytest -q -ra tests/bootstrap
      - run: PYTHONPATH=apps/api python -m pytest -q -ra tests/contract
      - name: Check OpenAPI compatibility against main on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          mkdir -p /tmp/roboport-openapi-base
          git show "${{ github.event.pull_request.base.sha }}:contracts/openapi.yaml" > /tmp/roboport-openapi-base/public.yaml
          git show "${{ github.event.pull_request.base.sha }}:contracts/auto-dev-openapi.yaml" > /tmp/roboport-openapi-base/auto-dev.yaml
          python scripts/check_openapi_compatibility.py --before /tmp/roboport-openapi-base/public.yaml --after contracts/openapi.yaml
          python scripts/check_openapi_compatibility.py --before /tmp/roboport-openapi-base/auto-dev.yaml --after contracts/auto-dev-openapi.yaml
      - run: python scripts/check_contract.py
      - name: Validate Markdown local links and heading anchors
        run: python scripts/check_docs_links.py
      - name: Validate AutoDealer page coverage and GAP ownership
        run: python scripts/check_autodealer_audit.py
      - run: python -m openapi_spec_validator contracts/openapi.yaml
      - name: Validate isolated synthetic auto OpenAPI
        run: python -m openapi_spec_validator contracts/auto-dev-openapi.yaml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Verify checked-in TypeScript types match OpenAPI
        working-directory: apps/web
        run: |
          npm run generate:api
          git diff --exit-code -- src/shared/api/schema.d.ts
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        run: npm run build
      - name: Validate frontend Docker builder can generate auto dev types
        run: docker build --target builder -f apps/web/Dockerfile -t roboport-web-builder-check .
      - name: Smoke-test Vite dev proxy against real loopback FastAPI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r apps/api/requirements-dev.txt -c apps/api/constraints-py313.txt
          python scripts/check_python_pins.py
          PYTHONPATH=apps/api python -m uvicorn roboport_api.main:app --host 127.0.0.1 --port 8000 > /tmp/roboport-api.log 2>&1 &
          API_PID=$!
          (cd apps/web && npm run dev -- --host 127.0.0.1 --port 5173) > /tmp/roboport-vite.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/api/v1/meta | grep -q '"Airmatik"'; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health/live | grep -q '"alive"'
          curl --fail --silent http://127.0.0.1:5173/account/login | grep -q 'root'
          for path in brands models models/unknown; do
            test "$(curl -s -o /tmp/roboport-error.json -w '%{http_code}' "http://127.0.0.1:5173/api/v1/catalog/$path")" = 404
            grep -q '"requestId"' /tmp/roboport-error.json
          done
  browser-e2e:
    runs-on: ubuntu-latest
    # В официальном образе уже установлены Chromium и системные библиотеки.
    # Версия обязана совпадать с @playwright/test в apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r apps/api/requirements-dev.txt -c apps/api/constraints-py313.txt
      - run: python scripts/check_python_pins.py
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund
      # Проверка реального запуска защищает от расхождения версий/библиотек.
      # Не устанавливаем системные пакеты apt заново на каждом cold runner.
      - name: Verify pinned Chromium and operating system dependencies
        working-directory: apps/web
        run: |
          node --input-type=module -e "import { chromium } from '@playwright/test'; const browser = await chromium.launch({ headless: true }); await browser.close();"
      - name: Browser E2E against synthetic FastAPI
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=apps/api python -m uvicorn roboport_api.main:app --host 127.0.0.1 --port 8000 > /tmp/roboport-e2e-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          cd apps/web
          npm run test:e2e
      - name: Browser navigation and search smoke for local Docsify portal
        working-directory: apps/web
        run: npm run test:docs:e2e
      - name: Publish browser acceptance screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roboport-browser-evidence
          path: |
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14

  windows-cmd:
    # Real native Windows runner, not Git Bash, WSL or PowerShell.
    # Dev smoke only: full PostgreSQL/API/browser E2E remain mandatory in Linux.
    runs-on: windows-latest
    # GitHub Windows CMD may default to cp1252 and cannot print Cyrillic docs
    # checker diagnostics unless Python stdout is explicitly UTF-8.
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Windows CMD - verify docs and links
        run: python scripts/check_docs_links.py
      - name: Windows CMD - install pinned frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Windows CMD - generate TS SDK and typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Windows CMD - frontend production build
        working-directory: apps/web
        run: npm run build
      - name: Windows CMD - install pinned Playwright Chromium
        working-directory: apps/web
        run: npx playwright install chromium
      - name: Windows CMD - Docsify browser navigation and search
        working-directory: apps/web
        run: npm run test:docs:e2e
      - name: Upload Windows CMD Docsify traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roboport-windows-cmd-evidence
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14
