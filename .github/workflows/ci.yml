name: ROBOport bootstrap CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh-auth-types:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/roboport-development-baseline'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - working-directory: apps/web
        run: npm run generate:api
      - name: Commit versioned types
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/shared/api/schema.d.ts
          git commit -m 'chore(auth): sync generated OpenAPI TypeScript types'
          git pull --rebase origin feat/roboport-development-baseline
          git push origin HEAD:feat/roboport-development-baseline
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r apps/api/requirements-dev.txt -c apps/api/constraints-py313.txt
      - run: python -m pip install openapi-spec-validator==0.7.2
      - run: python -m pip check
      - run: PYTHONPATH=apps/api python -m pytest -q tests/bootstrap
      - run: PYTHONPATH=apps/api python -m pytest -q tests/contract
      - run: python scripts/check_contract.py
      - run: python -m openapi_spec_validator contracts/openapi.yaml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Verify checked-in TypeScript types match OpenAPI
        working-directory: apps/web
        run: |
          npm run generate:api
          git diff --exit-code -- src/shared/api/schema.d.ts
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        run: npm run build
