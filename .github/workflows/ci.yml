name: ROBOport bootstrap CI
on:
  push:
  pull_request:
jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r apps/api/requirements-dev.txt
      - run: PYTHONPATH=apps/api python -m pytest -q tests/bootstrap
      - run: python scripts/check_contract.py
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      # Package lock is not generated in this offline environment: npm install verifies initially;
      # RP-003 must commit a lockfile and switch this to npm ci.
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
