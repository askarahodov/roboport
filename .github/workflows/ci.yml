name: ROBOport bootstrap CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh-lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/roboport-development-baseline'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate npm lock and commit once
        run: |
          set -euo pipefail
          cd apps/web
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run generate:api
          test -s src/shared/api/schema.d.ts
          npm run typecheck
          npm run build
          cd ../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package-lock.json apps/web/src/shared/api/schema.d.ts
          git commit -m 'chore(api): lock generator and commit generated OpenAPI types'
          git pull --rebase origin feat/roboport-development-baseline
          git push origin HEAD:feat/roboport-development-baseline
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r apps/api/requirements-dev.txt -c apps/api/constraints-py313.txt
      - run: python -m pip install openapi-spec-validator==0.7.2
      - run: python -m pip check
      - run: PYTHONPATH=apps/api python -m pytest -q tests/bootstrap
      - run: PYTHONPATH=apps/api python -m pytest -q tests/contract
      - run: python scripts/check_contract.py
      - run: python -m openapi_spec_validator contracts/openapi.yaml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Generate TypeScript types from versioned OpenAPI
        run: |
          mkdir -p apps/web/src/shared/api
          npx --yes --package openapi-typescript@7.10.1 openapi-typescript contracts/openapi.yaml -o apps/web/src/shared/api/schema.d.ts
          test -s apps/web/src/shared/api/schema.d.ts
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        run: npm run build
