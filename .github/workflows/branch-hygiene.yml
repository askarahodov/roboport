name: Branch hygiene — verified main

on:
  workflow_run:
    workflows: [ROBOport bootstrap CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (false deletes only verified merged branches)'
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/branch-hygiene.yml'
      - 'scripts/branch_hygiene.mjs'
      - 'tests/bootstrap/branch_hygiene.test.mjs'

permissions:
  contents: read

concurrency:
  group: branch-hygiene-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  policy-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test tests/bootstrap/branch_hygiene.test.mjs

  cleanup:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      # Never execute code or consume artifacts from an untrusted PR.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: node --test tests/bootstrap/branch_hygiene.test.mjs
      - uses: actions/github-script@v7
        with:
          script: |
            const {runHygiene} = await import(process.cwd() + '/scripts/branch_hygiene.mjs');
            const dryRun = context.eventName === 'schedule' ||
              (context.eventName === 'workflow_dispatch' && context.payload.inputs?.dry_run !== 'false');
            await runHygiene({github, context, core, dryRun});
