<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <title>Airmatik Pro Service — база знаний (dev)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.min.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div id="app">Загрузка базы знаний… Для просмотра необходим JavaScript и доступ к закреплённым ресурсам Docsify 5.0.0.</div>
  <script>
    window.$docsify = {
      name: 'Airmatik Pro Service',
      nameLink: '#/',
      repo: '',
      homepage: 'README.md',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 2,
      maxLevel: 3,
      auto2top: true,
      relativePath: true,
      executeScript: false,
      themeColor: '#126b68',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Поиск по документации',
        noData: 'Ничего не найдено',
        depth: 3,
        hideOtherSidebarContent: false
      },
      notFoundPage: true
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/plugins/search.min.js"></script>

</html>
